spec: docs/specs/googlesql/functions/string/format.md
dialect: googlesql
cases:
  - desc: format basic behaviour
    sql: SELECT FORMAT("%05d", 42)
    expected:
      rows:
        - ['00042']
  - desc: '%t and %T print FLOAT64 with a fractional part'
    sql: SELECT FORMAT('%t %T %t %t', x, x, x * 1e15, x / 3e5) FROM (SELECT 3.0 AS x)
    expected:
      rows:
        - ["3.0 3.0 3e+15 1e-05"]
  - desc: a NULL argument makes the result NULL except under %t and %T
    sql: SELECT FORMAT('00-%t-00 %T', NULL, CAST(NULL AS INT64)), FORMAT('%d', CAST(NULL AS INT64)), FORMAT('%s %t', CAST(NULL AS STRING), 1), FORMAT(CAST(NULL AS STRING), 1)
    expected:
      rows:
        - ["00-NULL-00 NULL", null, null, null]
  - desc: '%t and %T keep the fractional seconds of a TIMESTAMP'
    sql: SELECT FORMAT('%t|%T', t, t) FROM (SELECT TIMESTAMP '2026-08-17 22:37:14.701047+00' AS t)
    expected:
      rows:
        - ['2026-08-17 22:37:14.701047+00|TIMESTAMP "2026-08-17 22:37:14.701047+00"']
